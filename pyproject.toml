[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "case-score-diff"
version = "0.1.0"
description = "Compare saved JSONL evaluation scores offline and gate regressions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "xhl123XHL352", email = "194903029+xhl123XHL352@users.noreply.github.com"}]
dependencies = []

[project.urls]
Repository = "https://github.com/xhl123XHL352/case-score-diff"

[project.scripts]
case-score-diff = "case_score_diff.cli:main"

[tool.setuptools]
packages = ["case_score_diff"]
